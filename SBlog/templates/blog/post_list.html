<!DOCTYPE html>
<html>
<head>
    <title>Blog Posts</title>
</head>
<body>

    <h1>My Blog</h1>

    <p>
        <a href="{% url 'accounts:post_create' %}">Create New Post</a>&nbsp;&nbsp;&nbsp;&nbsp;
        <a href="{% url 'accounts:logout' %}">Logout</a>
    </p>

    {% for post in posts %}
        <hr>

        <h2>
            <a href="{% url 'accounts:post_detail' post.id %}">
                {{ post.title }}
            </a>
        </h2>

        <p>
            By {{ post.author }} |
            {{ post.created_at }}
        </p>

        <p>
            {{ post.content|truncatewords:15 }}
        </p>

    {% empty %}
        <p>No posts available.</p>
    {% endfor %}

</body>
</html>
