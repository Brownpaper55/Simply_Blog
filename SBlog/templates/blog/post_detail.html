<!DOCTYPE html>
<html>
<head>
    <title>{{ post.title }}</title>
</head>
<body>

    <h1>{{ post.title }}</h1>

    <p>
        By {{ post.author }}
    </p>

    <p>
        Published on {{ post.created_at }}
    </p>

    <hr>

    <p>
        {{ post.content }}
    </p>

    <hr>

    <a href="{% url 'accounts:post_edit' post.id %}">
        Edit
    </a>

    |

    <a href="{% url 'post_delete' post.id %}">
        Delete
    </a>

    |

    <a href="{% url 'post_list' %}">
        Back to Posts
    </a>

</body>
</html>
