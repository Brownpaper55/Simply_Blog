<!DOCTYPE html>
<html>
<head>
    <title>Edit Post</title>
</head>
<body>

    <h1>Edit Post</h1>

    <form method="POST">
        {% csrf_token %}

        <p>
            <label for="id_title">Title</label><br>
            <input
                type="text"
                name="title"
                id="id_title"
                value="{{ post.title }}"
                required
            >
        </p>

        <p>
            <label for="id_content">Content</label><br>
            <textarea
                name="content"
                id="id_content"
                rows="10"
                cols="50"
                required
            >{{ post.content }}</textarea>
        </p>

        <button type="submit">
            Save Changes
        </button>

    </form>

    <p>
        <a href="{% url 'post_detail' post.id %}">
            Cancel
        </a>
    </p>

</body>
</html>
