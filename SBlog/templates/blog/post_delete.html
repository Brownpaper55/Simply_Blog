<!DOCTYPE html>
<html>
<head>
    <title>Delete Post</title>
</head>
<body>

    <h1>Delete Post</h1>

    <p>
        Are you sure you want to delete:
    </p>

    <h2>{{ post.title }}</h2>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

    </form>

    <p>
        <a href="{% url 'post_detail' post.id %}">
            No, Go Back
        </a>
    </p>

</body>
</html>
